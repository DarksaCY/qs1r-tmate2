[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qs1r-tmate"
version = "0.3.0"
description = "Drive SDRMAX V (QS1R receiver) from a WoodBox Radio / Elad Tmate 2"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["hidapi>=0.14", "tomli>=2.0; python_version < '3.11'"]

[project.optional-dependencies]
tray = ["pystray>=0.19", "pillow>=10"]

[project.scripts]
qs1r-tmate = "qs1r_tmate.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
